
<!DOCTYPE html>
<html>
<head>
    <title>Transparent Picture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: black;
            font-family: Arial, sans-serif;
        }

        .picture {
            width: 100%;
            height: 100vh;
            background-image: url("/Users/yashrana/Downloads/“The truth is I love you_”.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
            opacity: 0.8;
        }

        .name {
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        .top-left {
            top: 20px;
            left: 20px;
        }

        .top-right {
            top: 20px;
            right: 20px;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
        }

        .center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
        }
    </style>
</head>

<body>
    <div class="picture">
        <div class="name top-left">Jane</div>
        <div class="name top-right">Jane</div>
        <div class="name bottom-left">Jane</div>
        <div class="name bottom-right">Jane</div>
        <div class="name center">Jane</div>
    </div>
</body>
</html>
