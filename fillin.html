<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Style Sheet Example</title>
  <style>
    p {
      color: rgb(147, 147, 192);
      font-size: 20px;
    }

</head>
